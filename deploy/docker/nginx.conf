# nginx in front of the console container (docker compose --profile https): HTTPS on 443 with the
# certificate in ./tls (console.crt with its chain, console.key), HTTP redirected to it.
# console.env needs TRUST_PROXY=1 so rate limits and logs see the caller's address.
# The gateway link (3443) is not proxied: it does its own mutual TLS.

server {
  listen 80;
  listen [::]:80;
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/tls/console.crt;
  ssl_certificate_key /etc/nginx/tls/console.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # OpenAPI imports and policy flows can be a few MB.
  client_max_body_size 8m;

  location / {
    proxy_pass http://console:3000;
    proxy_http_version 1.1;
    # The console checks Origin against Host for cookie-signed changes (CSRF): keep the host name.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
