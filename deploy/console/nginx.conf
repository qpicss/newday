# nginx site for the console: HTTPS on 443 to the console on 127.0.0.1:3000.
# install.sh --domain writes it to /etc/nginx/sites-available/oauth-console with your host name.
# Set TRUST_PROXY=loopback in console.env so rate limits and logs see the caller's address.
#
# The gateway link (3443) is not proxied here: it does its own mutual TLS, so gateways connect to
# the console process directly. Behind a cloud load balancer, forward 3443 as plain TCP.

server {
  listen 80;
  listen [::]:80;
  server_name console.example.com;

  # Let's Encrypt renewals
  location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name console.example.com;

  ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;

  # OpenAPI imports and policy flows can be a few MB.
  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    # The console checks Origin against Host for cookie-signed changes (CSRF): keep the host name.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
