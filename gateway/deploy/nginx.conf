# Layer 4 load balancer for a gateway cluster (used by docker-compose.yml --profile lb).
# TLS passes through untouched; each gateway node terminates it with its handler certificate.
worker_processes auto;
events { worker_connections 4096; }

stream {
  upstream gateway_nodes {
    least_conn;
    server gateway-1:8443 max_fails=3 fail_timeout=10s;
    server gateway-2:8443 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 443;
    proxy_pass gateway_nodes;
    proxy_connect_timeout 5s;
  }
}
